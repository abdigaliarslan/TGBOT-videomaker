# Push в main → тесты → выкладка на сервер тем же deploy/update.sh, что и руками.
#
# Секрет репозитория DEPLOY_SSH_KEY — приватный ключ, открытая часть которого
# лежит в ~/.ssh/authorized_keys пользователя dev на сервере. Ключ хоста
# закреплён в deploy/known_hosts. Сломанные тесты до сервера не доезжают.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Две выкладки одновременно перезапускали бы службы друг другу посреди работы.
# Новая ждёт старую, а не обрывает её: оборванный rsync оставит код наполовину.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Python-зависимости
        run: pip install -e ".[dev]"

      # Node стоит ДО pytest, а не после: самые сильные тесты в наборе —
      # пробники движения (`render/card_probe.mjs`) и линейка геометрии
      # (`render/measure.mjs`), и без `render/node_modules` они не падают, а
      # ПРОПУСКАЮТСЯ. Гейт из пропусков ничего не сторожит.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: render/package-lock.json

      - name: Зависимости рендера
        working-directory: render
        run: npm ci --no-audit --no-fund

      # Линейка геометрии меряет блок в НАСТОЯЩЕМ Chromium и тоже пропускается,
      # если браузера нет (`_looks_like_a_missing_browser`). На раннере Chrome
      # предустановлен, и `ensureBrowser` ничего не скачивает — но проверить это
      # дешевле, чем узнать по зелёной галочке на непройденном тесте.
      - name: Chromium для линейки
        working-directory: render
        run: npm run browser

      - name: Типы рендера
        working-directory: render
        run: npx tsc --noEmit -p .

      - name: pytest
        run: python -m pytest -q

      # Кэш модели faster-whisper (464 МБ): её тянет единственный slow-тест,
      # `test_asr_output_feeds_director`. Без кэша это скачивание на КАЖДОЙ
      # выкладке плюс отказ деплоя, если HuggingFace недоступен.
      - name: Кэш модели ASR
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-faster-whisper-small-${{ runner.os }}

      # Отдельным шагом, а не одним прогоном: в логе видно, сколько стоят
      # медленные тесты, и падение не путается с быстрыми. `-m 'not slow'` стоит
      # в addopts pyproject.toml, поэтому без этого шага сюда не доезжали ни
      # пробники движения, ни сверка с Chromium, ни автокроп — то есть всё, что
      # проверяет рендер.
      #
      # `-rs` печатает причины пропусков: один slow-тест ASR пропускается
      # сознательно (нужен whisperx, он не в dev-зависимостях), и пропуск — это
      # зелёный прогон. Выкладку валит только провал.
      - name: pytest (slow)
        run: python -m pytest -q -m slow -rs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::нет секрета DEPLOY_SSH_KEY"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          grep -v '^#' deploy/known_hosts > ~/.ssh/known_hosts
          # Имя хоста то же, что в локальном ~/.ssh/config: update.sh не меняется.
          cat > ~/.ssh/config <<'EOF'
          Host redstar
            HostName 109.199.115.142
            User dev
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Выкладка
        run: deploy/update.sh
