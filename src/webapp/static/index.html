<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Reels</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand" id="brand">…</div>
      <div class="topbar__actions">
        <button class="icon-btn" id="theme-toggle" type="button" data-i18n-aria="theme">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button class="balance-pill" id="balance-pill" type="button" data-i18n-aria="nav.balance">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span id="balance-value">0</span>
        </button>
      </div>
    </header>

    <main class="screens">
      <!-- ============================================================ Монтаж -->
      <section class="screen" data-screen="edit">
        <div class="preview" id="preview">
          <div class="preview__bg"></div>
          <button class="preview__play" id="preview-play" type="button" data-i18n-aria="preview.pause">
            <svg viewBox="0 0 24 24" width="16" height="16" class="i-pause"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/></svg>
            <svg viewBox="0 0 24 24" width="16" height="16" class="i-play"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          </button>
          <div class="preview__caption" id="preview-caption"></div>
        </div>

        <div class="tabs" id="preset-tabs" role="tablist"></div>

        <div class="chips">
          <button class="chips__arrow chips__arrow--left" id="chips-left" type="button" data-i18n-aria="back">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="chips__track" id="accent-chips"></div>
          <button class="chips__arrow chips__arrow--right" id="chips-right" type="button" data-i18n-aria="forward">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="chips">
          <button class="chips__arrow chips__arrow--left" id="font-left" type="button" data-i18n-aria="back">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="chips__track" id="font-chips"></div>
          <button class="chips__arrow chips__arrow--right" id="font-right" type="button" data-i18n-aria="forward">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="section-head">
          <h2 data-i18n="edit.video">Видео</h2>
          <button class="link-hint" id="requirements" type="button">
            <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span data-i18n="edit.requirements">Требования к видео</span>
          </button>
        </div>

        <label class="dropzone" id="dropzone">
          <input type="file" id="file-input" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv,.avi" hidden />
          <div class="dropzone__text">
            <strong id="drop-title" data-i18n="edit.upload">Загрузите видео</strong>
            <span id="drop-sub">.mp4, .mov, .m4v, .webm, .mkv, .avi</span>
          </div>
          <span class="round-btn" id="drop-action" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" class="i-plus"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <svg viewBox="0 0 24 24" width="18" height="18" class="i-close"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </span>
        </label>

        <div class="toggle-row">
          <span class="badge-new">NEW</span>
          <span class="toggle-row__label" data-i18n="opt.cut">Нарезать видео</span>
          <button class="help" type="button" data-help="cut">?</button>
          <label class="switch"><input type="checkbox" data-option="cut" /><span></span></label>
        </div>

        <div class="section-head"><h2 data-i18n="edit.params">Параметры</h2></div>
        <div class="toggle-row">
          <span class="toggle-row__label" data-i18n="opt.sfx">Звуковые эффекты</span>
          <button class="help" type="button" data-help="sfx">?</button>
          <label class="switch"><input type="checkbox" data-option="sfx" /><span></span></label>
        </div>
        <div class="toggle-row">
          <span class="toggle-row__label" data-i18n="opt.broll">Медиа-карточки</span>
          <button class="help" type="button" data-help="broll">?</button>
          <label class="switch"><input type="checkbox" data-option="broll" /><span></span></label>
        </div>
        <div class="toggle-row">
          <span class="toggle-row__label" data-i18n="opt.camera">Движение камеры</span>
          <button class="help" type="button" data-help="camera">?</button>
          <label class="switch"><input type="checkbox" data-option="camera" /><span></span></label>
        </div>

        <button class="cta" id="cta" type="button">
          <span class="cta__fill" id="cta-fill"></span>
          <span class="cta__title" id="cta-title"></span>
          <span class="cta__sub" id="cta-sub"></span>
        </button>
        <p class="balance-line"><span data-i18n="nav.balance">Баланс</span> <b id="balance-line">0</b></p>
      </section>

      <!-- ============================================================ Ролики -->
      <section class="screen" data-screen="videos" hidden>
        <div class="screen-title"><h1 data-i18n="nav.videos">Ролики</h1></div>
        <div id="jobs" class="jobs"></div>
      </section>

      <!-- ============================================================ Баланс -->
      <section class="screen" data-screen="balance" hidden>
        <div class="screen-title"><h1 data-i18n="nav.balance">Баланс</h1></div>
        <div class="card balance-card">
          <span class="muted" data-i18n="balance.on">На балансе</span>
          <div class="balance-card__value"><b id="balance-big">0</b> <span id="balance-unit"></span></div>
          <span class="muted" id="balance-note"></span>
        </div>
        <div class="section-head"><h2 data-i18n="balance.topup">Пополнить звёздами</h2></div>
        <div id="packages" class="packages"></div>
      </section>

      <!-- ============================================================ Профиль -->
      <section class="screen" data-screen="profile" hidden>
        <div class="screen-title"><h1 data-i18n="nav.profile">Профиль</h1></div>
        <div class="card profile-card">
          <div class="avatar" id="avatar">?</div>
          <div>
            <div class="profile-card__name" id="profile-name">…</div>
            <div class="muted" id="profile-username"></div>
          </div>
        </div>
        <div class="stats">
          <div class="card stat"><b id="stat-done">0</b><span class="muted" data-i18n="profile.done">смонтировано</span></div>
          <div class="card stat"><b id="stat-balance">0</b><span class="muted" data-i18n="profile.balance">на балансе</span></div>
        </div>
        <div class="section-head"><h2 data-i18n="profile.language">Язык интерфейса</h2></div>
        <div class="tabs" id="lang-tabs"></div>
        <p class="muted profile-hint" id="profile-hint"></p>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tabbar__item" data-nav="invite" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="10" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 19c.8-3.3 3.3-5 6.5-5s5.7 1.7 6.5 5M19 8v6M16 11h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span data-i18n="nav.invite">Пригласить</span>
      </button>
      <button class="tabbar__item" data-nav="videos" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3.5" y="8" width="17" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 5h12M8.5 2.5h7M10.5 11.5v5l4-2.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="nav.videos">Ролики</span>
        <i class="dot" id="videos-dot" hidden></i>
      </button>
      <button class="tabbar__main" data-nav="edit" type="button" data-i18n-aria="nav.edit">
        <span class="tabbar__orb">
          <svg viewBox="0 0 24 24" width="28" height="28"><path d="M10 3.5 11.6 8.4 16.5 10l-4.9 1.6L10 16.5 8.4 11.6 3.5 10l4.9-1.6zM18 13l.9 2.1L21 16l-2.1.9L18 19l-.9-2.1L15 16l2.1-.9z" fill="currentColor"/></svg>
        </span>
        <span data-i18n="nav.edit">Монтаж</span>
      </button>
      <button class="tabbar__item" data-nav="balance" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22"><ellipse cx="12" cy="6" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span data-i18n="nav.balance">Баланс</span>
        <i class="count" id="nav-balance">0</i>
      </button>
      <button class="tabbar__item" data-nav="profile" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.5 20c1-3.6 3.9-5.5 7.5-5.5s6.5 1.9 7.5 5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span data-i18n="nav.profile">Профиль</span>
      </button>
    </nav>

    <div class="toast" id="toast" hidden></div>
    <div class="blocker" id="blocker" hidden>
      <div class="card blocker__card">
        <h2 data-i18n="blocker.title">Откройте из Telegram</h2>
        <p class="muted" data-i18n="blocker.text">Приложение работает внутри бота: нажмите кнопку «Монтаж» в чате.</p>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
